# ============================================================
# Open Vocabulary 3D 模型训练配置文件
# ============================================================
# 运行方法:
#   单卡: python train_open_vocab_v2.py --config config/train_scannet_v2_full_multi_gpu.yaml
#   多卡: CUDA_VISIBLE_DEVICES=0,1 torchrun --nproc_per_node=2 train_open_vocab_v2_ddp.py --config config/train_scannet_v2_full_multi_gpu.yaml

# ============================================================
# GPU 配置
# ============================================================
gpu_ids: [0]  # 单卡模式使用的 GPU 编号（0=第一张卡）
                 # 🔥 多卡训练时，由命令行 CUDA_VISIBLE_DEVICES 控制
                 # 例: CUDA_VISIBLE_DEVICES=0,1 表示使用第1、2张卡

# ============================================================
# 数据加载配置
# ============================================================
dataloader:
  batch_size: 32  # 🔥 单卡训练建议值（显存足够可用 16）
                  # - 多卡时: 每个 GPU 的批大小
                  # - 单卡时: 总批大小
                  # - 显存不足时可减小到 4 或 2
  
  num_workers: 16  # 数据加载线程数
                  # - 单卡建议: 4-8
                  # - 多卡建议: 8-16
                  # - 过大会占用过多内存
  # 验证阶段单独控制，避免 epoch 末验证 OOM。
  val_batch_size: 12
  val_num_workers: 8

# ============================================================
# 数据集配置
# ============================================================
dataset:
  data_config_path: config/data_scannet_3d.yaml  # 3D 数据集路径配置文件
  
  precomputed_dir: /home/sunl/work/mix/data/pixel_pooled  # 预计算的 2D 特征目录
                                                           # 包含 ODISE 生成的 .npz 文件
  
  projection_dir: /home/sunl/work/mix/data/scannet_projections  # 预计算的投影坐标目录
                                                                 # 包含 3D→2D 投影对应关系
  
  split: train  # 数据集划分: train (训练集) / val (验证集) / test (测试集)

  aug: true     # 3D 数据增强（Z轴随机旋转 + 缩放[0.9,1.1] + 平移[-0.5,0.5]m，仅 train split）
                # 防止 MinkowskiEngine 死记硬背绝对坐标导致过拟合

  # ===== 数据量控制 =====
  # 取消下面一行的注释来限制数据量（用于测试或调试）
  max_samples_ratio: 1 # 使用数据的比例
                            # - 0.1 = 10% 数据 (9,522 samples)
                            # - 0.2 = 20% 数据 (19,044 samples)
                            # - 0.5 = 50% 数据 (47,610 samples)
                            # - 1.0 = 100% 数据 (95,220 samples)
                            # - 注释掉 = 100% 数据（默认）
                            # 
                            # 💡 单卡和多卡都支持这个参数！
                            # 💡 多卡测试时建议先用 0.1 验证代码正常

  # 验证集可单独限制样本数；设 null 表示完整验证集。
  val_max_samples: null
  val_max_samples_ratio: null

# ============================================================
# 模型配置
# ============================================================
model:
  # 使用预计算 2D 特征训练；这里只显式固定融合维度。
  # Geometry branch keeps the existing fused 256D query for point-mask matching.
  # Semantic MoE reads ODISE raw256 and LSeg raw512 in their own text spaces;
  # it does not project LSeg512 into ODISE256.
  pc_arch: MinkUNet34C
  pixel_embedding_dim: 512
  mask_embedding_dim: 256
  fused_embedding_dim: 256
  pc_last_dim: 256
  # ODISE-residual fusion alpha:
  #   learnable: alpha 从 alpha_init 初始化，并被限制在 [0, alpha_max] 内自学习
  #   fixed:     alpha 固定为 alpha_init，不参与训练；此时 alpha_max 不使用
  alpha_mode: fixed
  alpha_init: 1.25
  alpha_max: 2.0  # 只在 alpha_mode=learnable 时使用
  # Legacy semantic query is disabled. Source-aware semantic MoE below does not
  # use pixel_sem_proj, semantic_embeddings, or LSeg512->ODISE256 projection.
  use_semantic_query: false
  semantic_fusion_mode: fixed  # fixed 或 learnable
  semantic_odise_weight: 0.5
  semantic_lseg_weight: 0.5
  semantic_init_odise_weight: 0.3
  semantic_init_lseg_weight: 0.7
  semantic_proj_path: null  # 例如 runs/eval_only/lseg_to_odise_ridge_probe.pt
  freeze_semantic_proj: true
  use_source_reliability_gate: true
  source_gate_input_dim: 14
  source_gate_hidden_dim: 64
  source_gate_dropout: 0.1
  source_gate_init_bias: 0.0

# ============================================================
# 训练超参数配置
# ============================================================
trainer:
  # ----- 学习率相关 -----
  # base_lr: 5.0e-05  # 🔴 旧值（过拟合）
  base_lr: 0.00005    # 🔥 新值：降低 60% 以缓解过拟合 (2e-5 会被解析为字符串)
                      # - 多卡训练时会自动缩放: lr = base_lr × GPU数量
                      # - 例: 2卡时实际 lr = 0.00004
  
  # warmup_epochs: 0  # 🔴 旧值（从 checkpoint 继续时用）
  warmup_epochs: 1    # 🔥 新值：从头训练，使用 warmup
  
  scheduler_type: cosine  # 学习率调度器类型
                          # - cosine: 余弦退火（推荐，平滑下降）
                          # - step: 阶梯下降
                          # - plateau: 验证 loss 不降时下降
  
  # weight_decay: 0.0001  # 🔴 旧值（正则化不足，过拟合）
  weight_decay: 0.0004    # 🔥 新值：增加 10 倍以防止过拟合 (3e-4 会被解析为字符串)
  
  # ----- 训练轮数相关 -----
  num_epochs: 100  # 总训练轮数
                   # - 根据数据量和收敛情况调整
                   # - 20% 数据: 50-100 epochs
                   # - 100% 数据: 100-200 epochs
  
  # ----- 验证和保存 -----
  val_every_epochs: 1  # 每 N 个 epoch 进行一次验证
                       # - 频繁验证: 及时发现问题，但耗时
                       # - 建议: 1-5
  
  save_every_epochs: 1 # 每 N 个 epoch 保存一次检查点
                         # - 推荐: 5-10
                         # - 每个检查点约 458 MB
  
  checkpoint_dir: checkpoints/diff2scene_hybrid_lseg_odise256_semantic_query.3
  
  log_dir: runs/diff2scene_hybrid_lseg_odise256_semantic_query.3
  
  # ----- Diff2Scene Eq.1/Eq.2 Mask Distillation Loss -----
  use_mask_distill: true
  mask_distill_weight: 1.0
  bce_weight: 0.0            # 论文主 loss 不使用 BCE 辅助项
  dice_weight: 0.0           # 论文主 loss 不使用 Dice 辅助项
  min_points_per_mask: 6    # lifted 2D mask 在 3D 中正样本数 < 此值则不参与 loss
                             # - 过滤 GT 中正样本过少的 mask（可能是噪声）
                             # - 推荐值: 5-10
                             # - 太高: 过滤太严，有效样本少
                             # - 太低: 噪声增加，训练不稳定
  
  # ----- 训练稳定性 -----
  grad_clip_norm: 1.0  # 梯度裁剪阈值
                       # - 防止梯度爆炸
                       # - 梯度范数 > 阈值时会被缩放
                       # - 推荐值: 0.5 - 2.0
  
  # early_stopping_patience: 15  # 🔴 旧值（太宽松）
  early_stopping_patience: 10000   # 🔥 新值：更激进的早停，防止过拟合
  
  # ----- 梯度累积（降低显存峰值） -----
  gradient_accumulation_steps: 2  # 🔥 累积 2 个 micro-batch 再更新
                                  # - batch_size=16 × accum=2 = 有效 batch 32
                                  # - 显存减半，训练效果与 batch_size=32 等价
                                  # - DDP 下使用 no_sync() 优化，速度只慢 5-15%

  # ----- Open-vocabulary semantic mIoU -----
  # 混合模型 token 为 ODISE 原生 256 维，使用 ODISE word_head.text_proj 文本器评估。
  semantic_clip_model: "ODISE-256"
  # 现有 LSeg pixel_pooled 为 512 维，使用匹配的 ViT-B/32 文本空间评估。
  semantic_pixel_clip_model: "ViT-B/32"
  # p_final ∝ p_hybrid^lambda * p_lseg^(1-lambda)
  semantic_pc_lambda: 0.5
  semantic_prompt_template: "a photo of a {}"

  # ----- Dual-Space Semantic Probability Fusion -----
  # Geometry logits still come from fused_embeddings. Semantic readout keeps
  # ODISE and LSeg in their native text spaces, then fuses mask-class probs:
  #   ODISE raw256 @ ODISE text256
  #   LSeg raw512  @ CLIP text512
  dual_space_eval: true
  dual_space_odise_weight: 0.5
  dual_space_lseg_weight: 0.5
  dual_space_tau_odise: 0.07
  dual_space_tau_lseg: 0.07
  dual_space_use_confidence: false
  dual_space_conf_min: 0.2
  dual_space_conf_max: 0.7
  source_gate_train: true
  source_gate_loss_weight: 0.03
  source_gate_start_epoch: 3
  source_gate_detach_teacher_probs: true
  source_gate_detach_pred_logits: true
  source_gate_balance_reg: 0.0
  source_gate_entropy_reg: 0.0
  source_gate_monitor: "semantic_miou_dual_space_gate"
  best_monitor: "semantic_miou_dual_space_gate"
  
  # 【可选】恢复训练
  # resume: checkpoints/diff2scene_hybrid_lseg_odise256_semantic_query/checkpoint_epoch_2.pth # 续训使用最新 256D epoch checkpoint

# ============================================================
# 随机种子（确保可复现性）
# ============================================================
seed: 1342  # 随机种子
            # - 固定种子确保每次运行结果一致
            # - 用于调试和对比实验
