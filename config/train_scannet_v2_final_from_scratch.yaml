gpu_ids: [0]

dataloader:
  batch_size: 32
  num_workers: 16
  val_batch_size: 12
  val_num_workers: 8
  multiview_batch: true
  scenes_per_batch: 8
  views_per_scene: 4
  drop_last: true

dataset:
  data_config_path: config/local_data_paths.yaml
  precomputed_dir: null
  projection_dir: null
  split: train
  aug: true
  max_samples_ratio: 1
  val_max_samples: 128
  val_max_samples_ratio: null

model:
  pc_arch: MinkUNet34C
  pixel_embedding_dim: 512
  mask_embedding_dim: 256
  fused_embedding_dim: 256
  pc_last_dim: 256
  alpha_mode: fixed
  alpha_init: 1.25
  alpha_max: 2.0
  use_semantic_query: false
  semantic_fusion_mode: fixed
  semantic_odise_weight: 0.5
  semantic_lseg_weight: 0.5
  semantic_init_odise_weight: 0.3
  semantic_init_lseg_weight: 0.7
  semantic_proj_path: null
  freeze_semantic_proj: true
  use_source_reliability_gate: false
  use_point_semantic_gate: false
  use_region_reliability_gate: true
  region_gate_hidden_dim: 128
  region_gate_init_bias: 0.85
  region_gate_signal_dim: 11
  alignment_query_mode: fused

trainer:
  use_mask_distill: true
  base_lr: 0.00005
  warmup_epochs: 1
  scheduler_type: cosine
  weight_decay: 0.0004
  num_epochs: 100
  val_every_epochs: 5
  save_every_epochs: 1
  checkpoint_dir: checkpoints/diff2scene_fused_query_learned_region_gate_no_text_from_scratch_v1
  log_dir: runs/diff2scene_fused_query_learned_region_gate_no_text_from_scratch_v1
  log_every_steps: 20
  validation_log_every_batches: 25
  grad_clip_norm: 1.0
  early_stopping_patience: 10000
  use_amp: true
  use_model_half: false
  gradient_accumulation_steps: 2
  max_batches_per_epoch: null
  resume: null

  lambda_align: 1.0
  mask_distill_weight: 1.0
  bce_weight: 0.0
  dice_weight: 0.0
  min_points_per_mask: 6

  alignment_query_mode: fused
  source_gate_train: false
  source_gate_training_target: none
  use_lseg_semantic_loss: false
  use_odise_semantic_loss: false
  use_point_gate_loss: false

  use_region_gate_loss: true
  lambda_region_gate: 0.05
  region_gate_input_mode: fused_plus_all_no_text_signals
  region_gate_target_mode: mv_plus_sharp
  region_gate_mv_weight: 1.0
  region_gate_sharp_weight: 0.5
  region_gate_target_scale: 5.0
  region_gate_target_min: 0.35
  region_gate_target_max: 0.85
  region_gate_target_default: 0.70
  region_gate_mv_iou_thr: 0.05
  region_gate_max_pairs_per_mask: 10
  region_gate_min_lifted_points: 5
  region_gate_loss_type: mse
  region_gate_detach_target: true

  dual_space_eval: true
  semantic_readout_mode: learned_region_gate
  semantic_readout_ablation: false
  monitor_metric: semantic_miou_learned_region_gate
  fast_val: true
  fast_val_only_main_metric: true

  semantic_size_aware: true
  semantic_small_area_thr: 0.01
  semantic_medium_area_thr: 0.10
  semantic_small_lseg_weight: 0.45
  semantic_medium_lseg_weight: 0.65
  semantic_large_lseg_weight: 0.80

  semantic_projected_gate: true
  semantic_projected_gate_scale: 10.0
  semantic_projected_gate_min: 0.45
  semantic_projected_gate_max: 0.85
  semantic_projected_gate_default: 0.70

  semantic_projected_size_gate: true
  semantic_projected_size_base: 0.65
  semantic_projected_size_beta: 1.0
  semantic_projected_size_gamma: 0.20
  semantic_projected_size_min: 0.35
  semantic_projected_size_max: 0.85

  enable_size_aware_ablation: false
  enable_projected_size_gate_ablation: false
  enable_verbose_legacy_probes: false
  enable_legacy_source_gate_logs: false
  allow_gt_ce_upper_bound: false

seed: 1342
