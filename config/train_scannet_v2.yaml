dataloader:
  batch_size: 2
  num_workers: 2
dataset:
  data_config_path: config/data_scannet_3d.yaml
  max_samples_ratio: 0.25
  precomputed_dir: /home/sunl/work/mix/data/pixel_pooled
  split: train
# model: null
# For low VRAM, use smaller 3D backbone and/or enable use_model_half in trainer
model:
  pc_arch: MinkUNet18A  # options: MinkUNet18A, MinkUNet34C (default, larger)
trainer:
  base_lr: 5.0e-05
  checkpoint_dir: checkpoints
  early_stopping_patience: 10
  grad_clip_norm: 0.5
  log_dir: runs/open_vocab_3d_v2
  num_epochs: 50
  save_every_epochs: 10
  scheduler_type: cosine
  val_every_epochs: 5
  warmup_epochs: 3
  weight_decay: 0.0001
  # use_model_half: true  # set to true to reduce VRAM (model in float16)
