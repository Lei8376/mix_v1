# ============================================================
# 快速测试配置 (20% 数据, 10 epochs)
# ============================================================
# 用途: 快速验证代码是否正常工作
# 运行: python train_open_vocab_v2.py --config config/train_scannet_v2_minimal.yaml

# 数据加载
dataloader:
  batch_size: 32   # 每个 GPU 的批大小 (必须 ≥ 2)
  num_workers: 16   # 数据加载线程数
##sdad
# 数据集
dataset:
  data_config_path: config/data_scannet_3d.yaml
  max_samples_ratio: 0.2  # 只使用 20% 数据 (19,044 samples)
                          # 修改为 0.1 = 10%, 1.0 = 100%, 删除 = 100%
  precomputed_dir: /home/sunl/work/mix/data/pixel_pooled
  projection_dir: /home/sunl/work/mix/data/scannet_projections
  split: train

# 模型
model: null  # 使用预计算特征

# 训练参数
trainer:
  base_lr: 5.0e-05           # 学习率 0.00005
  num_epochs: 10             # 总轮数 (快速测试用 10 轮)
  warmup_epochs: 1           # 预热轮数
  weight_decay: 0.0001       # 权重衰减
  grad_clip_norm: 0.5        # 梯度裁剪
  scheduler_type: cosine     # 学习率调度器
  
  # Loss 参数
  bce_weight: 1.0            # BCE loss 权重
  dice_weight: 1.0           # Dice loss 权重
  min_points_per_mask: 10    # GT 正样本数 < 此值的 mask 不参与训练
  
  checkpoint_dir: checkpoints/0.2_2
  log_dir: "runs/open_vocab_3d_v2_minimal_0.2_2"
  resume: checkpoints/0.2_2/checkpoint_epoch_7.pth
  save_every_epochs: 5
  val_every_epochs: 1
  early_stopping_patience: 10