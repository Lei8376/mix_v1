# ============================================================
# 抗过拟合优化配置 - 基于 train_scannet_v2_full_multi_gpu.yaml
# ============================================================
# 主要修改：
# 1. 降低学习率（5e-5 → 2e-5）缓解过拟合
# 2. 增强正则化（weight_decay: 0.0001 → 0.001）
# 3. 更激进的早停（patience: 10 → 5）
#
# 使用方法:
#   python train_open_vocab_v2.py --config config/train_scannet_v2_anti_overfit.yaml

# ============================================================
# GPU 配置
# ============================================================
gpu_ids: [0]

# ============================================================
# 数据加载配置
# ============================================================
dataloader:
  batch_size: 16
  num_workers: 16

# ============================================================
# 数据集配置
# ============================================================
dataset:
  data_config_path: config/data_scannet_3d.yaml
  precomputed_dir: /home/sunl/work/mix/data/pixel_pooled
  projection_dir: /home/sunl/work/mix/data/scannet_projections
  split: train

# ============================================================
# 模型配置
# ============================================================
model: null

# ============================================================
# 训练超参数配置（🔥 抗过拟合优化）
# ============================================================
trainer:
  # ----- 学习率相关 -----
  base_lr: 2.0e-05  # 🔥 降低学习率：5e-5 → 2e-5（降低 60%）
                    # 原因：较小的学习率让模型更缓慢拟合，提升泛化
  
  warmup_epochs: 1  # 学习率预热
  
  scheduler_type: cosine
  
  weight_decay: 0.001  # 🔥 增强正则化：0.0001 → 0.001（增加 10 倍）
                       # 原因：L2 正则惩罚大权重，防止过拟合
  
  # ----- 训练轮数相关 -----
  num_epochs: 100
  
  # ----- 验证和保存 -----
  val_every_epochs: 1  # 每个 epoch 验证，便于及时发现问题
  
  save_every_epochs: 5  # 每 5 个 epoch 定期保存
  
  checkpoint_dir: checkpoints/anti_overfit  # 新的 checkpoint 目录，避免覆盖
  
  log_dir: runs/anti_overfit  # 新的日志目录
  
  # ----- 训练稳定性 -----
  grad_clip_norm: 1.0
  
  early_stopping_patience: 5  # 🔥 更激进的早停：10 → 5
                              # 原因：连续 5 个 epoch 不改善就停止，防止过拟合
  
  # Loss 参数
  bce_weight: 1.0
  dice_weight: 1.0
  min_points_per_mask: 10
  
  # 不要 resume，从头训练以应用新的超参数
  # resume: null

# ============================================================
# 随机种子
# ============================================================
seed: 1342


# ============================================================
# 📝 使用说明
# ============================================================
#
# 1. 从头训练（推荐）：
#    python train_open_vocab_v2.py --config config/train_scannet_v2_anti_overfit.yaml
#
# 2. 观察指标：
#    - Train Loss vs Val Loss 差距应该缩小
#    - Val mIoU 应该持续提升
#    - 如果 early stopping 在 epoch 5-10 触发，说明过拟合仍严重
#
# 3. 如果还是过拟合，尝试更激进的配置：
#    - base_lr: 1.0e-05（更低）
#    - weight_decay: 0.01（更强）
#
# 4. TensorBoard 可视化：
#    tensorboard --logdir runs/anti_overfit --port 6006
#
# ============================================================
