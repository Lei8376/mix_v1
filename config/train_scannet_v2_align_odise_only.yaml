gpu_ids: [0]

dataloader:
  batch_size: 4
  num_workers: 0
  val_batch_size: 2
  val_num_workers: 0
  multiview_batch: true
  scenes_per_batch: 1
  views_per_scene: 4
  drop_last: true

dataset:
  data_config_path: config/data_scannet_3d.yaml
  precomputed_dir: /home/sunl/work/mix/data/pixel_pooled
  projection_dir: /home/sunl/work/mix/data/scannet_projections
  split: train
  aug: true
  max_samples_ratio: 1
  val_max_samples: 8
  val_max_samples_ratio: null

model:
  pc_arch: MinkUNet34C
  pixel_embedding_dim: 512
  mask_embedding_dim: 256
  fused_embedding_dim: 256
  pc_last_dim: 256
  alpha_mode: fixed
  alpha_init: 1.25
  alpha_max: 2.0
  use_semantic_query: false
  semantic_fusion_mode: fixed
  semantic_odise_weight: 0.5
  semantic_lseg_weight: 0.5
  semantic_init_odise_weight: 0.3
  semantic_init_lseg_weight: 0.7
  semantic_proj_path: null
  freeze_semantic_proj: true
  use_source_reliability_gate: false
  alignment_query_mode: odise_only

trainer:
  use_mask_distill: true
  base_lr: 0.00005
  warmup_epochs: 1
  scheduler_type: cosine
  weight_decay: 0.0004
  num_epochs: 5
  val_every_epochs: 1
  save_every_epochs: 999
  checkpoint_dir: checkpoints/align_query_odise_only
  log_dir: runs/align_query_odise_only
  log_every_steps: 20
  grad_clip_norm: 1.0
  early_stopping_patience: 20
  use_amp: true
  use_model_half: false
  gradient_accumulation_steps: 1
  max_batches_per_epoch: 100
  resume: checkpoints/diff2scene_hybrid_lseg_odise256_text_free_source_gate_mv_grouped_v1/checkpoint_epoch_4.pth

  mask_distill_weight: 1.0
  bce_weight: 0.0
  dice_weight: 0.0
  min_points_per_mask: 6

  alignment_query_mode: odise_only
  source_gate_train: false
  semantic_readout_mode: projected_gate
  semantic_readout_ablation: true
  monitor_metric: semantic_miou_projected_gate
  dual_space_eval: true

  semantic_size_aware: true
  semantic_small_area_thr: 0.01
  semantic_medium_area_thr: 0.10
  semantic_small_lseg_weight: 0.45
  semantic_medium_lseg_weight: 0.65
  semantic_large_lseg_weight: 0.80

  semantic_projected_gate: true
  semantic_projected_gate_scale: 10.0
  semantic_projected_gate_min: 0.45
  semantic_projected_gate_max: 0.85
  semantic_projected_gate_default: 0.70

  semantic_projected_size_gate: true
  semantic_projected_size_base: 0.65
  semantic_projected_size_beta: 1.0
  semantic_projected_size_gamma: 0.20
  semantic_projected_size_min: 0.35
  semantic_projected_size_max: 0.85

seed: 1342
