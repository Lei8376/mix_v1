# ODISE 生产环境配置 - 批量处理 ScanNet 数据集
# 使用方法：python precompute_features.py --config ../config/odise_config_production.yaml

data:
  data_root: "/home/featurize/data/scannet_2d"  # ScanNet 2D 数据集根目录
  output_dir: "/home/featurize/data/odise_features"  # 输出根目录
  scene_pattern: "scene*"  # 场景匹配模式
  image_extensions: ["jpg", "png"]

processing:
  batch_size: 1              # 批处理大小（建议保持1）
  max_scenes: 0              # 0表示处理所有场景
  max_images_per_scene: 0    # 0表示处理每个场景的所有图片
  skip_existing: true        # 跳过已存在的文件（重要！）
  device: "cuda"
  verbose: true

odise:
  model_config: "Panoptic/odise_caption_coco_50e.py"
  label_sets: ["SCANNET_200"]  # 只用 SCANNET_200
  vocab: ""
  overlap_threshold: 0.0
  object_mask_threshold: 0.0

output:
  output_name_template: "{img_idx}_odise.npz"
  compressed: true           # 使用压缩保存（减少磁盘空间）
  save_masks: true
  save_embeddings: true
  save_metadata: true

debug:
  enabled: false
  save_visualization: false
