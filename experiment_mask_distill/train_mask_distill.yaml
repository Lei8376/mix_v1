# ============================================================
# Mask Distillation 训练配置（experiment_mask_distill）
# 对应 Diff2Scene 论文 Eq.1&2：mask-level cosine distillation
#
# # 指定其他 runs 目录
#cd mix/experiment_mask_distill && bash train.sh 
# python test_proj/print_training_log.py --runs-dir runs/distill.1 --top-k 15

# 主损失：
#   L = (1/K) * sum_k [1 - cos(B_k^{3d'}, B_k^{3d})]
#   B_k^{3d'} = sigmoid(<F^{3d}, f_k^{2d}>)
#   B_k^{3d}  = lifted 2D soft mask（直接取概率值，不二值化）
#
# 辅助损失（bce_weight=0 表示不使用）：
#   L_aux = bce_weight * L_bce + dice_weight * L_dice
# ============================================================

gpu_ids: [0]

dataloader:
  batch_size: 16
  num_workers: 8

dataset:
  data_config_path: config/data_scannet_3d.yaml
  precomputed_dir: /home/featurize/data/pixel_pooled
  projection_dir: /home/featurize/data/scannet_projections
  split: train
  max_samples_ratio: 1
  aug: true   # 3D 数据增强：Z轴随机旋转 + 缩放[0.9,1.1] + 平移[-0.5,0.5]m（仅 train split）

model: null

trainer:
  # ----- 学习率 -----
  base_lr: 0.0001
  warmup_epochs: 1
  scheduler_type: cosine
  weight_decay: 0.0004

  # ----- 训练轮数 -----
  num_epochs: 200

  # ----- 验证和保存 -----
  val_every_epochs: 1
  save_every_epochs: 5
  checkpoint_dir: checkpoints/diff2scene_hybrid_lseg_pc_adaptive_alpha.1
  log_dir: runs/diff2scene_hybrid_lseg_pc_adaptive_alpha.1

  # ----- Mask Distillation Loss 权重（Diff2Scene 方案）-----
  mask_distill_weight: 1.0   # L_mask_distill 主损失权重
  bce_weight: 0.0            # 辅助 BCE（先纯试 mask distillation，设为 0）
  dice_weight: 0.0           # 辅助 Dice（同上，设为 0）
  min_points_per_mask: 5    # GT mask 至少需要多少个正样本点才参与 loss

  # ----- 稳定性 -----
  grad_clip_norm: 1.0
  early_stopping_patience: 999    # 关闭 early stopping（设为足够大的值）
  gradient_accumulation_steps: 2

  # ----- 启用 mask distillation trainer -----
  use_mask_distill: true

  # ----- Open-vocabulary semantic evaluation -----
  # hybrid/text: fused hybrid model token vs text, usually 768-dim CLIP ViT-L text
  semantic_clip_model: "ViT-L/14@336px"
  # lseg/text: existing 512-dim pixel_pooled feature vs matching CLIP-B text encoder.
  semantic_pixel_clip_model: "ViT-B/32"
  # Geometric mean: p_final ∝ p_hybrid^lambda * p_lseg^(1-lambda)
  semantic_pc_lambda: 0.5
  semantic_prompt_template: "a {} in a scene"

  # # ----- 恢复训练（可选）-----
  resume: ""
seed: 1342
